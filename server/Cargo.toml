[package]
name = "superstar-server"
version = "0.1.0"
edition = "2021"
description = "Offline replacement server for Dalcomsoft's SuperStar games"
publish = false

[lib]
name = "superstar_server"
# rlib for the desktop binary, cdylib to ship inside the APK as libss.so
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "superstar-server"
path = "src/main.rs"

[dependencies]
serde_json = "1"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ecb = { version = "0.1", features = ["alloc"] }
base64 = "0.22"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "unwind"
